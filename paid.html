<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X$ Board — Checkout required</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="Checkout required to unlock X$ Board paid handles." />
  <style>
    :root {
      --bg:#070b14; --card:#10182a; --text:#e8eefc; --muted:#9aa8c7;
      --accent:#5b8cff; --gold:#fbbf24; --line:rgba(255,255,255,.08);
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(1200px 600px at 20% -10%, #1a2744 0%, var(--bg) 55%), var(--bg);
      color:var(--text); display:flex; align-items:center; justify-content:center; padding:2rem;
    }
    .card {
      width:min(520px,100%); background:var(--card); border:1px solid var(--line);
      border-radius:18px; padding:2rem; box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    .eyebrow { color:var(--gold); font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
    h1 { margin:.5rem 0 0.75rem; font-size:1.6rem; line-height:1.2; }
    p { color:var(--muted); line-height:1.55; margin:0 0 1rem; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
      background:linear-gradient(180deg,#7aa2ff,#4f7fff); color:#fff; text-decoration:none;
      font-weight:700; border-radius:12px; padding:.85rem 1.1rem; border:0;
    }
    .btn:hover { filter:brightness(1.05); }
    a.secondary { color:var(--accent); }
    .note { font-size:.8rem; color:var(--muted); margin-top:1.25rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Checkout required</div>
    <h1>Unlock via Stripe</h1>
    <p>This old URL no longer hosts the paid board. Complete checkout to receive the unlock link.</p>
    <p><a class="btn" href="https://buy.stripe.com/aFa4gy5Tvdez5ej65V6Vq00">Unlock names — $12/mo</a></p>
    <p>Or return to the <a class="secondary" href="./index.html">free Hot Tips board</a>.</p>
    <p class="note">True access control needs a backend. This static stub only points to checkout.</p>
  </main>
</body>
</html>
