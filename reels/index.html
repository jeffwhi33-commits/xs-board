<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>X$ Board - Hot Tips Reel</title>
  <style>
    :root { --bg:#070b14; --green:#34e880; --text:#f4f6fa; --muted:#9aa8c7; }

      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 1.1rem 1rem 2.5rem; }
    .brand { color: var(--green); font-weight: 800; letter-spacing: .04em; font-size: .82rem; }
    h1 { font-size: 1.35rem; letter-spacing: -.03em; margin: .35rem 0 .9rem; line-height: 1.25; }
    video { width: 100%; max-height: 70vh; border-radius: 16px; background: #000; display: block; }
    a.cta {
      display: block; margin: 1rem 0 .6rem; text-align: center; text-decoration: none;
      background: var(--green); color: #06140a; font-weight: 800; font-size: 1.05rem;
      padding: .95rem 1rem; border-radius: 999px;
    }
    .sub { text-align: center; color: var(--muted); font-size: .88rem; line-height: 1.45; }
    .sub a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <div class="brand">X$ BOARD</div>

    <video controls playsinline webkit-playsinline muted src="c2b-hot-tips-v10.mp4"></video>

    <p class="sub">Ranked by real buy-call results, not followers.<br>

  </main>
</body>
</html>
